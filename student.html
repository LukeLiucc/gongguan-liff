<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>公館運動館 學員服務</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --ink:#111827; --sub:#6b7280; --line:#e5e7eb;
    --brand:#ff3d7f; --brand-ink:#ffffff; --ok:#059669; --warn:#d97706; --err:#dc2626;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.55}
  header{background:var(--ink);color:#fff;padding:18px 16px 16px}
  header h1{margin:0;font-size:18px;letter-spacing:.5px}
  header p{margin:4px 0 0;font-size:13px;color:#cbd5e1}
  main{padding:16px;max-width:560px;margin:0 auto}
  .view{display:none}.view.on{display:block}
  .card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  h2{font-size:17px;margin:0 0 12px}
  label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
  label:first-child{margin-top:0}
  .hint{font-size:13px;color:var(--sub);margin-top:4px}
  input[type=text],input[type=tel],input[type=date],input[type=time],input[type=datetime-local],select,textarea{
    width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-family:inherit}
  textarea{min-height:110px;resize:vertical}
  .check{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-weight:400}
  .check input{margin-top:4px;width:18px;height:18px;flex:none}
  .check small{display:block;color:var(--sub)}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;background:var(--brand);color:var(--brand-ink);margin-top:18px;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:600;margin-top:10px}
  .btn:disabled{opacity:.5}
  .menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .menu button{background:var(--card);border:0;border-radius:var(--radius);padding:18px 12px;text-align:left;font-family:inherit;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .menu b{display:block;font-size:16px;color:var(--ink)}
  .menu span{display:block;font-size:13px;color:var(--sub);margin-top:4px}
  .menu .icon{font-size:24px;display:block;margin-bottom:8px}
  .back{background:none;border:0;color:var(--sub);font-size:14px;padding:0 0 12px;cursor:pointer}
  .rec{border-top:1px solid var(--line);padding:12px 0}
  .rec:first-of-type{border-top:0;padding-top:0}
  .rec .t{font-weight:600}
  .rec .m{font-size:14px;color:var(--sub)}
  .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#eef2ff;color:#3730a3;margin-left:6px;font-weight:600}
  .tag.ok{background:#d1fae5;color:#065f46}.tag.warn{background:#fef3c7;color:#92400e}
  .answer{background:#f9fafb;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px;white-space:pre-wrap}
  .preview{margin-top:8px;max-width:100%;border-radius:10px;display:none}
  .done{text-align:center;padding:28px 16px}
  .done .big{font-size:44px}
  .msg{position:fixed;left:16px;right:16px;bottom:24px;max-width:528px;margin:0 auto;background:var(--err);color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;display:none;z-index:9}
  .loading{text-align:center;color:var(--sub);padding:48px 0}
  .empty{color:var(--sub);font-size:14px}
</style>
</head>
<body>
<header>
  <h1>公館運動館 學員服務</h1>
  <p id="hello">請假、改期、問教練，都在這裡完成</p>
</header>

<main>
  <!-- 載入中 -->
  <section class="view on" id="v-loading"><div class="loading">載入中…</div></section>

  <!-- 綁定 -->
  <section class="view" id="v-bind">
    <div class="card">
      <h2 id="bind-title">第一次使用，請先綁定資料</h2>
      <label for="b-name">姓名</label>
      <input type="text" id="b-name" autocomplete="name">
      <label for="b-phone">手機</label>
      <input type="tel" id="b-phone" inputmode="numeric" placeholder="0912345678">

      <label>上課類型（可複選）</label>
      <label class="check"><input type="checkbox" id="b-personal"><div>個人教練課<small>一對一、一對二</small></div></label>
      <div id="b-coach-wrap" style="display:none">
        <label for="b-coach">你的個人課教練</label>
        <select id="b-coach"></select>
      </div>

      <label class="check"><input type="checkbox" id="b-group"><div>團課期課<small>TRX、器械皮拉提斯、瑜珈、游泳等</small></div></label>
      <div id="b-course-wrap" style="display:none">
        <label>你報名的團課</label>
        <div id="b-courses"></div>
      </div>

      <button class="btn" id="b-submit">完成綁定</button>
      <button class="btn ghost" id="b-cancel" style="display:none">取消</button>
    </div>
  </section>

  <!-- 首頁 -->
  <section class="view" id="v-home">
    <div class="menu">
      <button data-go="group" id="m-group"><span class="icon">🗓️</span><b>團課請假</b><span>送出即完成</span></button>
      <button data-go="personal" id="m-personal"><span class="icon">🔁</span><b>個人課請假</b><span>順便提改期時段</span></button>
      <button data-go="ask"><span class="icon">💬</span><b>問教練</b><span>動作、訓練問題</span></button>
      <button data-go="records"><span class="icon">📋</span><b>我的紀錄</b><span>請假與回覆</span></button>
    </div>
    <button class="btn ghost" data-go="bind">修改綁定資料</button>
  </section>

  <!-- 團課請假 -->
  <section class="view" id="v-group">
    <button class="back" data-go="home">← 回首頁</button>
    <div class="card">
      <h2>團課請假</h2>
      <label for="g-course">課程</label>
      <select id="g-course"></select>
      <label for="g-date">請假日期</label>
      <select id="g-date"></select>
      <input type="date" id="g-date-other" style="display:none;margin-top:8px">
      <label for="g-reason">原因（可不填）</label>
      <textarea id="g-reason" style="min-height:70px"></textarea>
      <button class="btn" id="g-submit">送出請假</button>
    </div>
  </section>

  <!-- 個人課請假 -->
  <section class="view" id="v-personal">
    <button class="back" data-go="home">← 回首頁</button>
    <div class="card">
      <h2>個人課請假・改期</h2>
      <p class="hint" id="p-coach"></p>
      <label for="p-date">原本的上課日期</label>
      <input type="date" id="p-date">
      <label for="p-time">原本的上課時間</label>
      <input type="time" id="p-time" step="1800">
      <label for="p-slot1">希望改到的時段 ①</label>
      <input type="datetime-local" id="p-slot1" step="1800">
      <label for="p-slot2">希望改到的時段 ②（可不填）</label>
      <input type="datetime-local" id="p-slot2" step="1800">
      <label for="p-reason">原因（可不填）</label>
      <textarea id="p-reason" style="min-height:70px"></textarea>
      <button class="btn" id="p-submit">送出給教練確認</button>
    </div>
  </section>

  <!-- 問教練 -->
  <section class="view" id="v-ask">
    <button class="back" data-go="home">← 回首頁</button>
    <div class="card">
      <h2>問教練</h2>
      <label for="a-coach">要問哪位教練</label>
      <select id="a-coach"></select>
      <label for="a-q">你的問題</label>
      <textarea id="a-q" placeholder="例：深蹲時膝蓋會往內夾，要怎麼調整？"></textarea>
      <label for="a-img">附一張照片（可不附）</label>
      <input type="file" id="a-img" accept="image/*">
      <img class="preview" id="a-preview" alt="">
      <button class="btn" id="a-submit">送出問題</button>
    </div>
  </section>

  <!-- 我的紀錄 -->
  <section class="view" id="v-records">
    <button class="back" data-go="home">← 回首頁</button>
    <div class="card"><h2>請假紀錄</h2><div id="r-leaves"></div></div>
    <div class="card"><h2>提問紀錄</h2><div id="r-questions"></div></div>
  </section>

  <!-- 完成 -->
  <section class="view" id="v-done">
    <div class="card done">
      <div class="big">✅</div>
      <p id="done-msg"></p>
      <button class="btn" data-go="home">回首頁</button>
      <button class="btn ghost" id="close-btn">關閉視窗</button>
    </div>
  </section>
</main>
<div class="msg" id="msg"></div>

<script>
/* ===== 設定：部署後填入 ===== */
const CONFIG = {
  LIFF_ID: '2012173674-836Qe98c',
  GAS_URL: 'https://script.google.com/macros/s/AKfycbzl7dxqf5YtNx7Jns9XeyNxuRG-HZGk5ff2akUBlKBbyxo7ccZvtK77-pFJoj7S0V8Z/exec'
};

let state = { student: null, coaches: [], courses: [] };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function show(view){
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + view));
  window.scrollTo(0, 0);
}
function toast(text){
  const m = $('msg'); m.textContent = text; m.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => m.style.display = 'none', 4000);
}
async function api(action, payload = {}){
  const idToken = liff.getIDToken();
  if (!idToken) { liff.login({ redirectUri: location.href }); throw new Error('請重新登入'); }
  const res = await fetch(CONFIG.GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, payload, idToken })
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || '發生錯誤');
  return j.data;
}
async function run(btn, fn){
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = '處理中…';
  try { await fn(); } catch (e) { toast(e.message); }
  finally { btn.disabled = false; btn.textContent = label; }
}
function done(text){ $('done-msg').textContent = text; show('done'); }

/* ===== 綁定 ===== */
function fillBind(){
  const st = state.student;
  $('bind-title').textContent = st ? '修改綁定資料' : '第一次使用，請先綁定資料';
  $('b-cancel').style.display = st ? 'block' : 'none';
  $('b-name').value = st?.name || '';
  $('b-phone').value = st?.phone || '';
  $('b-coach').innerHTML = '<option value="">請選擇</option>' +
    state.coaches.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
  $('b-coach').value = st?.coachId || '';
  $('b-personal').checked = !!st?.personal;
  $('b-courses').innerHTML = state.courses.length ? state.courses.map(c => `
    <label class="check"><input type="checkbox" value="${esc(c.id)}" ${st?.groupCourseIds?.includes(c.id) ? 'checked' : ''}>
    <div>${esc(c.name)}<small>週${esc(c.weekday)} ${esc(c.time)}・${esc(c.coachName)} 教練</small></div></label>`).join('')
    : '<p class="empty">目前沒有開課中的團課</p>';
  $('b-group').checked = !!st?.groupCourseIds?.length;
  toggleBind();
}
function toggleBind(){
  $('b-coach-wrap').style.display = $('b-personal').checked ? 'block' : 'none';
  $('b-course-wrap').style.display = $('b-group').checked ? 'block' : 'none';
}
$('b-personal').onchange = toggleBind;
$('b-group').onchange = toggleBind;
$('b-cancel').onclick = () => show('home');
$('b-submit').onclick = e => run(e.target, async () => {
  const groupIds = $('b-group').checked
    ? [...$('b-courses').querySelectorAll('input:checked')].map(i => i.value) : [];
  if ($('b-group').checked && !groupIds.length) throw new Error('請勾選你報名的團課');
  const data = await api('bind', {
    name: $('b-name').value, phone: $('b-phone').value,
    personal: $('b-personal').checked, coachId: $('b-coach').value, groupCourseIds: groupIds
  });
  Object.assign(state, data);
  renderHome(); show('home');
});

/* ===== 首頁 ===== */
function myCourses(){ return state.courses.filter(c => state.student?.groupCourseIds?.includes(c.id)); }
function renderHome(){
  $('hello').textContent = `${state.student.name} 你好，請假、改期、問教練，都在這裡完成`;
  $('m-group').style.display = myCourses().length ? 'block' : 'none';
  $('m-personal').style.display = state.student.personal ? 'block' : 'none';
}
function go(view){
  if (view === 'bind') { fillBind(); return show('bind'); }
  if (view === 'group') { prepGroup(); }
  if (view === 'personal') { prepPersonal(); }
  if (view === 'ask') { prepAsk(); }
  if (view === 'records') { loadRecords(); }
  show(view);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (b) go(b.dataset.go);
});

/* ===== 團課請假 ===== */
const WD = { '日':0,'天':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6 };
function ymd(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function wdLabel(s){ const p = s.split('-').map(Number); return '日一二三四五六'[new Date(p[0], p[1]-1, p[2]).getDay()]; }
function upcomingDates(course){
  const days = [...String(course.weekday)].map(ch => WD[ch]).filter(n => n !== undefined);
  if (!days.length) return [];
  const out = [];
  const d = new Date(); d.setHours(0,0,0,0);
  if (course.start) { const p = course.start.split('-').map(Number); const s = new Date(p[0], p[1]-1, p[2]); if (s > d) d.setTime(s.getTime()); }
  for (let i = 0; i < 70 && out.length < 8; i++) {
    const s = ymd(d);
    if (course.end && s > course.end) break;
    if (days.includes(d.getDay())) out.push(s);
    d.setDate(d.getDate() + 1);
  }
  return out;
}
function prepGroup(){
  const list = myCourses();
  $('g-course').innerHTML = list.map(c => `<option value="${esc(c.id)}">${esc(c.name)}（週${esc(c.weekday)} ${esc(c.time)}）</option>`).join('');
  fillDates();
}
function fillDates(){
  const c = myCourses().find(x => x.id === $('g-course').value);
  const dates = c ? upcomingDates(c) : [];
  $('g-date').innerHTML = dates.map(s => `<option value="${s}">${s}（${wdLabel(s)}）</option>`).join('') +
    '<option value="other">其他日期…</option>';
  toggleOther();
}
function toggleOther(){ $('g-date-other').style.display = $('g-date').value === 'other' ? 'block' : 'none'; }
$('g-course').onchange = fillDates;
$('g-date').onchange = toggleOther;
$('g-submit').onclick = e => run(e.target, async () => {
  const date = $('g-date').value === 'other' ? $('g-date-other').value : $('g-date').value;
  if (!date) throw new Error('請選擇請假日期');
  const r = await api('leaveGroup', { courseId: $('g-course').value, date, reason: $('g-reason').value });
  $('g-reason').value = '';
  done(r.message);
});

/* ===== 個人課請假 ===== */
function prepPersonal(){
  const c = state.coaches.find(x => x.id === state.student.coachId);
  $('p-coach').textContent = c ? `你的個人課教練：${c.name}` : '';
}
$('p-submit').onclick = e => run(e.target, async () => {
  const r = await api('leavePersonal', {
    date: $('p-date').value, time: $('p-time').value,
    slot1: $('p-slot1').value, slot2: $('p-slot2').value, reason: $('p-reason').value
  });
  ['p-date','p-time','p-slot1','p-slot2','p-reason'].forEach(id => $(id).value = '');
  done(r.message);
});

/* ===== 問教練 ===== */
let imageData = null;
function prepAsk(){
  const ids = new Set();
  if (state.student.personal && state.student.coachId) ids.add(state.student.coachId);
  myCourses().forEach(c => c.coachId && ids.add(c.coachId));
  const list = state.coaches.filter(c => ids.has(c.id));
  $('a-coach').innerHTML = list.length
    ? list.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')
    : '<option value="">你還沒有綁定教練，請先修改綁定資料</option>';
}
$('a-img').onchange = async e => {
  const file = e.target.files[0];
  imageData = null; $('a-preview').style.display = 'none';
  if (!file) return;
  try {
    imageData = await compress(file, 1280, 0.82);
    $('a-preview').src = imageData; $('a-preview').style.display = 'block';
  } catch (err) { toast('這張照片無法讀取，請換一張'); }
};
function compress(file, max, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(img.src);
      resolve(cv.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
$('a-submit').onclick = e => run(e.target, async () => {
  const r = await api('ask', {
    coachId: $('a-coach').value, question: $('a-q').value,
    imageBase64: imageData || '', imageType: imageData ? 'image/jpeg' : ''
  });
  $('a-q').value = ''; $('a-img').value = ''; imageData = null; $('a-preview').style.display = 'none';
  done(r.message);
});

/* ===== 我的紀錄 ===== */
function statusTag(s){
  const cls = /已成立|已確認|已回覆/.test(s) ? 'ok' : /待|提出新時段/.test(s) ? 'warn' : '';
  return `<span class="tag ${cls}">${esc(s)}</span>`;
}
async function loadRecords(){
  $('r-leaves').innerHTML = $('r-questions').innerHTML = '<p class="empty">載入中…</p>';
  try {
    const r = await api('myRecords');
    $('r-leaves').innerHTML = r.leaves.length ? r.leaves.map(l => `
      <div class="rec">
        <div class="t">${esc(l.date)}（${wdLabel(l.date)}）${esc(l.time)} ${esc(l.course)}${statusTag(l.status)}</div>
        <div class="m">${esc(l.coach)} 教練</div>
        ${l.type === '個人課' ? `<div class="m">提出的改期：${esc(l.slot1)}${l.slot2 ? '、' + esc(l.slot2) : ''}</div>` : ''}
        ${l.confirmed ? `<div class="answer">${l.status === '已確認改期' ? '改到' : '教練提出新時段'}：${esc(l.confirmed)}${l.note ? '\n教練備註：' + esc(l.note) : ''}</div>` : ''}
      </div>`).join('') : '<p class="empty">還沒有請假紀錄</p>';
    $('r-questions').innerHTML = r.questions.length ? r.questions.map(q => `
      <div class="rec">
        <div class="t">問 ${esc(q.coach)} 教練${statusTag(q.status)}</div>
        <div class="m">${esc(q.time)}</div>
        <div class="answer">${esc(q.question)}</div>
        ${q.image ? `<div class="m"><a href="${esc(q.image)}" target="_blank">查看附圖</a></div>` : ''}
        ${q.answer ? `<div class="answer"><b>教練回覆：</b>\n${esc(q.answer)}</div>` : ''}
      </div>`).join('') : '<p class="empty">還沒有提問紀錄</p>';
  } catch (e) { toast(e.message); }
}

/* ===== 啟動 ===== */
$('close-btn').onclick = () => liff.isInClient() ? liff.closeWindow() : show('home');

(async () => {
  try {
    await liff.init({ liffId: CONFIG.LIFF_ID });
    if (!liff.isLoggedIn()) return liff.login({ redirectUri: location.href });
    $('close-btn').style.display = liff.isInClient() ? 'block' : 'none';
    Object.assign(state, await api('init'));
    if (!state.student) { fillBind(); return show('bind'); }
    renderHome();
    const mode = new URLSearchParams(location.search).get('mode');
    if (mode === 'leave') {
      if (myCourses().length && !state.student.personal) return go('group');
      if (state.student.personal && !myCourses().length) return go('personal');
      return show('home');
    }
    if (['group','personal','ask','records','bind'].includes(mode)) return go(mode);
    show('home');
  } catch (e) {
    $('v-loading').innerHTML = `<div class="loading">無法載入：${esc(e.message)}<br>請關閉後重新開啟</div>`;
  }
})();
</script>
</body>
</html>
