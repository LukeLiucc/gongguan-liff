<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>公館運動館 教練工作台</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --ink:#111827; --sub:#6b7280; --line:#e5e7eb;
    --brand:#ff3d7f; --brand-ink:#ffffff; --err:#dc2626; --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.55}
  header{background:var(--ink);color:#fff;padding:18px 16px 0}
  header h1{margin:0;font-size:18px}
  header p{margin:4px 0 12px;font-size:13px;color:#cbd5e1}
  .tabs{display:flex;gap:4px}
  .tabs button{flex:1;background:none;border:0;color:#94a3b8;font-size:15px;font-weight:700;padding:10px 0 12px;border-bottom:3px solid transparent;cursor:pointer;font-family:inherit}
  .tabs button.on{color:#fff;border-bottom-color:var(--brand)}
  .tabs .count{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--brand);color:#fff;font-size:12px;margin-left:4px}
  main{padding:16px;max-width:560px;margin:0 auto}
  .view{display:none}.view.on{display:block}
  .card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  h2{font-size:15px;color:var(--sub);margin:4px 0 10px;font-weight:700}
  h3{font-size:17px;margin:0 0 4px}
  .m{font-size:14px;color:var(--sub)}
  .box{background:#f9fafb;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px;white-space:pre-wrap}
  .box img{max-width:100%;border-radius:8px;margin-top:8px;display:block}
  label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
  .opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-weight:400;font-size:15px}
  .opt input{width:18px;height:18px;flex:none}
  input[type=text],input[type=tel],input[type=datetime-local],select,textarea{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-family:inherit}
  textarea{min-height:90px;resize:vertical}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:700;background:var(--brand);color:var(--brand-ink);margin-top:14px;cursor:pointer}
  .btn:disabled{opacity:.5}
  .seg{display:flex;background:#e5e7eb;border-radius:10px;padding:3px;margin-bottom:12px}
  .seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-size:15px;font-weight:600;color:var(--sub);cursor:pointer;font-family:inherit}
  .seg button.on{background:#fff;color:var(--ink)}
  .row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:12px 0}
  .row:first-child{border-top:0;padding-top:0}
  .row .when{font-weight:700;white-space:nowrap}
  .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#eef2ff;color:#3730a3;font-weight:600;margin-left:6px}
  .tag.warn{background:#fef3c7;color:#92400e}
  .empty{color:var(--sub);font-size:14px;text-align:center;padding:20px 0}
  .loading{text-align:center;color:var(--sub);padding:48px 0}
  .msg{position:fixed;left:16px;right:16px;bottom:24px;max-width:528px;margin:0 auto;background:var(--err);color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;display:none;z-index:9}
  .msg.ok{background:#059669}
  .hidden{display:none}
  a{color:#2563eb}
</style>
</head>
<body>
<header>
  <h1>公館運動館 教練工作台</h1>
  <p id="hello">處理學員請假、改期與提問</p>
  <div class="tabs hidden" id="tabs">
    <button data-tab="todo" class="on">待辦<span class="count hidden" id="todo-count"></span></button>
    <button data-tab="leaves">請假名單</button>
  </div>
</header>

<main>
  <section class="view on" id="v-loading"><div class="loading">載入中…</div></section>

  <section class="view" id="v-bind">
    <div class="card">
      <h3>教練綁定</h3>
      <p class="m">第一次使用請選擇你的名字，並輸入管理員給你的綁定碼。</p>
      <label for="c-id">教練</label>
      <select id="c-id"></select>
      <label for="c-code">綁定碼</label>
      <input type="tel" id="c-code" inputmode="numeric">
      <button class="btn" id="c-submit">完成綁定</button>
    </div>
  </section>

  <section class="view" id="v-todo">
    <h2>待確認的改期</h2>
    <div id="t-resched"></div>
    <h2 style="margin-top:20px">待回覆的提問</h2>
    <div id="t-questions"></div>
  </section>

  <section class="view" id="v-leaves">
    <div class="seg">
      <button data-days="1" class="on">今天</button>
      <button data-days="7">未來 7 天</button>
    </div>
    <div class="card" id="l-list"></div>
  </section>
</main>
<div class="msg" id="msg"></div>

<script>
/* ===== 設定：部署後填入 ===== */
const CONFIG = {
  LIFF_ID: '2012173674-XGe2YAoT',
  GAS_URL: 'https://script.google.com/macros/s/AKfycbzl7dxqf5YtNx7Jns9XeyNxuRG-HZGk5ff2akUBlKBbyxo7ccZvtK77-pFJoj7S0V8Z/exec'
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let leaveDays = 1;

function show(view){
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + view));
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === view));
  window.scrollTo(0, 0);
}
function toast(text, ok){
  const m = $('msg'); m.textContent = text; m.className = 'msg' + (ok ? ' ok' : ''); m.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => m.style.display = 'none', 3500);
}
async function api(action, payload = {}){
  const idToken = liff.getIDToken();
  if (!idToken) { liff.login({ redirectUri: location.href }); throw new Error('請重新登入'); }
  const res = await fetch(CONFIG.GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, payload, idToken })
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || '發生錯誤');
  return j.data;
}
async function run(btn, fn){
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = '處理中…';
  try { await fn(); } catch (e) { toast(e.message); }
  finally { btn.disabled = false; btn.textContent = label; }
}
function driveThumb(url){
  const m = String(url).match(/\/d\/([^/]+)/);
  return m ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w800` : '';
}

/* ===== 綁定 ===== */
$('c-submit').onclick = e => run(e.target, async () => {
  const r = await api('coachBind', { coachId: $('c-id').value, code: $('c-code').value });
  enter(r.coach, 'todo');
});

/* ===== 分頁 ===== */
function enter(coach, tab){
  $('hello').textContent = `${coach.name} 教練，處理學員請假、改期與提問`;
  $('tabs').classList.remove('hidden');
  openTab(tab === 'leaves' ? 'leaves' : 'todo');
}
function openTab(tab){
  show(tab);
  tab === 'todo' ? loadTodo() : loadLeaves();
}
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => openTab(b.dataset.tab));
document.querySelectorAll('[data-days]').forEach(b => b.onclick = () => {
  leaveDays = Number(b.dataset.days);
  document.querySelectorAll('[data-days]').forEach(x => x.classList.toggle('on', x === b));
  loadLeaves();
});

/* ===== 待辦 ===== */
async function loadTodo(){
  $('t-resched').innerHTML = $('t-questions').innerHTML = '<div class="card empty">載入中…</div>';
  try {
    const r = await api('coachTodo');
    const n = r.reschedules.length + r.questions.length;
    $('todo-count').textContent = n; $('todo-count').classList.toggle('hidden', !n);

    $('t-resched').innerHTML = r.reschedules.length ? r.reschedules.map(x => `
      <div class="card" data-rq="${esc(x.id)}">
        <h3>${esc(x.student)}<span class="tag warn">個人課</span></h3>
        <div class="m">${esc(x.phone)}・送出 ${esc(x.submittedAt)}</div>
        <div class="box">原上課：${esc(x.date)}${esc(x.weekday)} ${esc(x.time)}${x.reason ? '\n原因：' + esc(x.reason) : ''}</div>
        <label>改到哪個時段</label>
        <label class="opt"><input type="radio" name="d-${esc(x.id)}" value="slot1">① ${esc(x.slot1)}</label>
        ${x.slot2 ? `<label class="opt"><input type="radio" name="d-${esc(x.id)}" value="slot2">② ${esc(x.slot2)}</label>` : ''}
        <label class="opt"><input type="radio" name="d-${esc(x.id)}" value="other">都不行，我提新時段</label>
        <input type="datetime-local" class="other hidden" step="1800">
        <label>備註給學員（可不填）</label>
        <input type="text" class="note" placeholder="例：當天改在 B 區上課">
        <button class="btn">送出並通知學員</button>
      </div>`).join('') : '<div class="card empty">沒有待確認的改期</div>';

    $('t-questions').innerHTML = r.questions.length ? r.questions.map(x => `
      <div class="card" data-q="${esc(x.id)}">
        <h3>${esc(x.student)}</h3>
        <div class="m">送出 ${esc(x.submittedAt)}</div>
        <div class="box">${esc(x.question)}${x.image ? `<a href="${esc(x.image)}" target="_blank"><img src="${esc(driveThumb(x.image))}" alt="學員附圖"></a>` : ''}</div>
        <label>你的回覆</label>
        <textarea class="answer"></textarea>
        <button class="btn">回覆並通知學員</button>
      </div>`).join('') : '<div class="card empty">沒有待回覆的提問</div>';

    bindTodo();
  } catch (e) { toast(e.message); }
}
function bindTodo(){
  document.querySelectorAll('[data-rq]').forEach(card => {
    const other = card.querySelector('.other');
    card.querySelectorAll('input[type=radio]').forEach(r => r.onchange = () => other.classList.toggle('hidden', r.value !== 'other' || !r.checked));
    card.querySelector('.btn').onclick = e => run(e.target, async () => {
      const picked = card.querySelector('input[type=radio]:checked');
      if (!picked) throw new Error('請選擇改期時段');
      const r = await api('coachReschedule', {
        id: card.dataset.rq, decision: picked.value, otherSlot: other.value, note: card.querySelector('.note').value
      });
      toast(r.message, true); loadTodo();
    });
  });
  document.querySelectorAll('[data-q]').forEach(card => {
    card.querySelector('.btn').onclick = e => run(e.target, async () => {
      const r = await api('coachAnswer', { id: card.dataset.q, answer: card.querySelector('.answer').value });
      toast(r.message, true); loadTodo();
    });
  });
}

/* ===== 請假名單 ===== */
async function loadLeaves(){
  $('l-list').innerHTML = '<div class="empty">載入中…</div>';
  try {
    const r = await api('coachLeaves', { days: leaveDays });
    if (!r.list.length) { $('l-list').innerHTML = `<div class="empty">${leaveDays === 1 ? '今天' : '未來 7 天'}沒有人請假</div>`; return; }
    $('l-list').innerHTML = r.list.map(x => `
      <div class="row">
        <div>
          <div><b>${esc(x.student)}</b><span class="tag ${x.type === '個人課' ? 'warn' : ''}">${esc(x.course)}</span></div>
          <div class="m">${esc(x.phone)}${x.reason ? '・' + esc(x.reason) : ''}</div>
          ${x.type === '個人課' ? `<div class="m">${esc(x.status)}</div>` : ''}
        </div>
        <div class="when">${leaveDays === 1 ? '' : esc(x.date.slice(5)) + esc(x.weekday) + '<br>'}${esc(x.time)}</div>
      </div>`).join('');
  } catch (e) { toast(e.message); }
}

/* ===== 啟動 ===== */
(async () => {
  try {
    await liff.init({ liffId: CONFIG.LIFF_ID });
    if (!liff.isLoggedIn()) return liff.login({ redirectUri: location.href });
    const r = await api('coachInit');
    if (!r.bound) {
      $('c-id').innerHTML = '<option value="">請選擇</option>' + r.coaches.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
      return show('bind');
    }
    enter(r.coach, new URLSearchParams(location.search).get('tab'));
  } catch (e) {
    $('v-loading').innerHTML = `<div class="loading">無法載入：${esc(e.message)}<br>請關閉後重新開啟</div>`;
  }
})();
</script>
</body>
</html>
