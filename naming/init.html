<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>init2</title></head>
<body style="font-family:monospace;font-size:16px;padding:30px;white-space:pre-wrap">
<div id="out">測試儲存服務中…</div>
<script>
const out=document.getElementById("out");
const log=s=>{out.textContent+="\n"+s};
(async()=>{
  out.textContent="RESULTS:";
  // 1. kvdb.io
  try{
    const r=await fetch("https://kvdb.io/",{method:"POST",body:new URLSearchParams({email:""})});
    if(!r.ok){log("kvdb CREATE_FAIL "+r.status)}
    else{
      const bucket=(await r.text()).trim();
      const val=JSON.stringify({ping:Date.now()});
      const w=await fetch("https://kvdb.io/"+bucket+"/gongguan",{method:"POST",body:val});
      const g=await fetch("https://kvdb.io/"+bucket+"/gongguan");
      const back=(await g.text()).trim();
      log(back===val?("kvdb OK bucket="+bucket):("kvdb RWFAIL w="+w.status+" g="+g.status+" back="+back.slice(0,50)));
    }
  }catch(e){log("kvdb ERR "+e)}
  // 2. textdb
  try{
    const id="gongguan_"+Math.random().toString(36).slice(2,10);
    const val="hello"+Date.now();
    const w=await fetch("https://textdb.online/update/?key="+id+"&value="+encodeURIComponent(val));
    const wt=await w.text();
    const g=await fetch("https://textdb.online/"+id);
    const back=(await g.text()).trim();
    log(back===val?("textdb OK id="+id):("textdb MISMATCH w="+w.status+" wt="+wt.slice(0,40)+" back="+back.slice(0,40)));
  }catch(e){log("textdb ERR "+e)}
  // 3. jsonblob (text/plain)
  try{
    const r=await fetch("https://jsonblob.com/api/jsonBlob",{method:"POST",headers:{"Content-Type":"text/plain"},body:"{}"});
    const loc=r.headers.get("Location")||"";
    log("jsonblob status="+r.status+" loc="+loc);
  }catch(e){log("jsonblob ERR "+e)}
  log("DONE");
})();
</script></body></html>
